name: Build and publish Angular site to /docs

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-publish-angular.yml'
      - '.angular/**'
      - 'angular.json'
      - 'assets/**'
      - 'documents/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tsconfig*.json'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-and-publish-angular-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site into docs
        run: pnpm exec ng build --configuration production --output-path=docs --base-href=/

      - name: Normalize GitHub Pages output
        shell: bash
        run: |
          if [[ -f docs/browser/index.html ]]; then
            shopt -s dotglob nullglob
            mv docs/browser/* docs/
            rmdir docs/browser
          fi

          cp docs/index.html docs/404.html
          touch docs/.nojekyll

      - name: Validate build output
        shell: bash
        run: |
          if [[ ! -s docs/index.html || ! -s docs/404.html ]]; then
            echo "Build failed: docs/index.html or docs/404.html is missing or empty." >&2
            exit 1
          fi

      - name: Commit and push built site
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all docs

          if git diff --cached --quiet; then
            echo "No docs changes to publish."
            exit 0
          fi

          git commit -m "chore: build site [skip ci]"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

      - name: Report published site
        run: echo "Site should be published at https://carloswm85.github.io"
