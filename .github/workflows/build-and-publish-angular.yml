name: Build and publish Angular site to GitHub Pages

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-publish-angular.yml'
      - '.angular/**'
      - 'angular.json'
      - 'assets/**'
      - 'documents/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tsconfig*.json'
      - '!docs/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-and-publish-angular.yml'
      - '.angular/**'
      - 'angular.json'
      - 'assets/**'
      - 'documents/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'src/**'
      - 'tsconfig*.json'
      - '!docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-publish-angular-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production site into docs
        run: pnpm exec ng build --configuration production --output-path=docs --base-href=/

      - name: Normalize GitHub Pages output
        shell: bash
        run: |
          if [[ -f docs/browser/index.html ]]; then
            shopt -s dotglob nullglob
            mv docs/browser/* docs/
            rmdir docs/browser
          fi

          cp docs/index.html docs/404.html
          touch docs/.nojekyll

      - name: Validate build output
        shell: bash
        run: |
          if [[ ! -s docs/index.html || ! -s docs/404.html ]]; then
            echo "Build failed: docs/index.html or docs/404.html is missing or empty." >&2
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
